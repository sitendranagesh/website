<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - My Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <!-- SVG Logo -->
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        <h1>My Notes <span class="author">by <strong>Sitendra</strong></span></h1>
      </div>
    </header>

    <main class="main-content login-container">
      <div class="login-card">
        <h2>Welcome Back</h2>
        <form id="login_form">
          <input type="text" id="username" placeholder="Username" required />
          <input type="email" id="email" placeholder="Email" autocomplete="email" required />
          <input type="password" id="password" placeholder="Password" required />
          <button type="submit">Secure Log In</button>
          <p id="login_error" style="color: var(--danger); margin-top: 1rem; font-weight: 500;"></p>
        </form>
        <p style="margin-top: 0.75rem; color: var(--text-muted); font-size: 0.9rem;">
            <a href="./forgot-password.html" style="color: var(--primary);">Forgot your password?</a>
        </p>

        <p style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
            New here? <a href="./signup.html" style="color: var(--primary);">Create an account</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Sitendra Kumar Nagesh. All rights reserved.</p>
    </footer>

    <script>
      document.getElementById("login_form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("login_error");

        errorEl.textContent = "";

        try {
          const params = new URLSearchParams({ username, password });
          const response = await fetch(`/login?${params.toString()}`, {
            method: "POST",
          });

          if (!response.ok) {
            errorEl.textContent = "Invalid username or password.";
            return;
          }

          window.location.href = "./index.html";
        } catch (error) {
          errorEl.textContent = "Something went wrong. Try again.";
          console.error(error);
        }
      });
    </script>
  </body>
</html>
