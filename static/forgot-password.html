<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Sitendra Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        <h1>My Notes <span class="author">by <strong>Sitendra</strong></span></h1>
      </div>
    </header>

    <main class="main-content login-container">
      <div class="login-card">
        <h2>Reset Your Password</h2>
        <form id="forgot_form">
          <input type="email" id="email" placeholder="Your account email" autocomplete="email" required />
          <button type="submit">Send Reset Link</button>
          <p id="forgot_message" style="margin-top: 1rem; font-weight: 500;"></p>
        </form>
        <p style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
          <a href="./login.html" style="color: var(--primary);">Back to login</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Sitendra Kumar Nagesh. All rights reserved.</p>
    </footer>

    <script>
      document.getElementById("forgot_form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const messageEl = document.getElementById("forgot_message");
        const submitBtn = e.target.querySelector("button");

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        try {
          const params = new URLSearchParams({ email });
          const response = await fetch(`/forgot-password?${params.toString()}`, { method: "POST" });
          const data = await response.json();

          messageEl.style.color = "var(--success)";
          messageEl.textContent = data.status;
        } catch (error) {
          messageEl.style.color = "var(--danger)";
          messageEl.textContent = "Something went wrong. Try again.";
          console.error(error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Reset Link";
        }
      });
    </script>
  </body>
</html>
