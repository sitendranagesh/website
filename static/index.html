<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - My Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    
  <header class="site-header">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
      </svg>
      <h1>My Notes <span class="author">by <strong>Sitendra</strong></span></h1>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span id="current_user" class="user-badge"></span>
      <button id="logout_btn" class="secondary">Logout</button>
    </div>
  </header>

    <main class="main-content">
      <div class="box-grid">
        <aside class="left-box">
          <h2>Note History</h2>
          <div class="all-notes-list" id="all-notes-list"></div>
        </aside>
        
        <section class="right-box">
          <input type="text" name="note_title" id="note_title" placeholder="Enter Note Title..." autocomplete="off" />
          <textarea name="notes" id="note_textarea" rows="18" placeholder="Start typing your note here..."></textarea>
          <div>
            <button type="button" id="note_submit" class="success">Save Note</button>
          </div>
          <p id="myOutput" style="margin-top: 1rem; color: var(--success); font-weight: 500;"></p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Sitendra Kumar Nagesh. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
