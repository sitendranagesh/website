<!doctype html>
<html>
  <head>
    <title>Simple Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>My Notes</h1>
    <div class="box-flex">
      <div class="left-box">
        <h2>History:</h2>

        <div class="all-notes-list" id="all-notes-list"></div>
      </div>
      <div class="divider"></div>
      <div class="right-box">
        <button><a href="./template.html"> all notes </a></button>
        <br />
        <textarea name="notes" id="note_textarea" rows="10"> </textarea>
        <br />
        <input
          type="text"
          name="note_title"
          id="note_title"
          placeholder="Note Title"
        />
        <button type="button" id="note_submit">add notes</button>
        <p id="myOutput"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
