<!DOCTYPE html>
<html>
  <head>
    <title> Simple Notes </title>
    <style type="text/css" media="all">

    body {
      color: #F2F2ED;
      background-color: #118AB2;
    }

    h1 {
      background-color: #118AB2;
    }

    textarea {
      background-color: #F2F2ED;
      color: #464B71;
      border: 2px solid black;
      border-radius: 5px;
      font-size: 1.5rem;
      box-sizing: 100%;
    }

    button {
      background-color: #464B71;
      color: #F2F2ED;
      border: 2px solid #F2F2ED;
      border-radius: 5px;
    }

    button:hover {
      background-color: #118AB2;
      color: #464B71;
      border: 2px solid #464B71;
    }
      
    </style>
  </head>
  <body>
    <h1> My Notes </h1>
    <textarea name="notes" id=notes rows="10"> </textarea>
    <br />
    <button type="submit"> add notes </button>
    <!-- https://colorhunt.co/palette/464b71118ab27cd5c7f2f2ed$0 -->
  </body>
</html>
