<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password - Sitendra Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        <h1>My Notes <span class="author">by <strong>Sitendra</strong></span></h1>
      </div>
    </header>

    <main class="main-content login-container">
      <div class="login-card">
        <h2>Choose a New Password</h2>
        <form id="reset_form">
          <input type="password" id="new_password" placeholder="New password (min 8 characters)" autocomplete="new-password" required />
          <input type="password" id="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required />
          <button type="submit">Update Password</button>
          <p id="reset_message" style="margin-top: 1rem; font-weight: 500;"></p>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Sitendra Kumar Nagesh. All rights reserved.</p>
    </footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const form = document.getElementById("reset_form");
      const messageEl = document.getElementById("reset_message");

      if (!token) {
        form.style.display = "none";
        messageEl.style.color = "var(--danger)";
        messageEl.textContent = "Missing or invalid reset link.";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const newPassword = document.getElementById("new_password").value;
        const confirmPassword = document.getElementById("confirm_password").value;
        const submitBtn = form.querySelector("button");

        messageEl.textContent = "";

        if (newPassword !== confirmPassword) {
          messageEl.style.color = "var(--danger)";
          messageEl.textContent = "Passwords don't match.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Updating...";

        try {
          const bodyParams = new URLSearchParams({ token, new_password: newPassword });
          const response = await fetch(`/reset-password?${bodyParams.toString()}`, { method: "POST" });
          const data = await response.json();

          if (!response.ok) {
            messageEl.style.color = "var(--danger)";
            messageEl.textContent = data.detail || "Something went wrong.";
            return;
          }

          messageEl.style.color = "var(--success)";
          messageEl.textContent = "Password updated! Redirecting to login...";
          setTimeout(() => { window.location.href = "./login.html"; }, 1500);
        } catch (error) {
          messageEl.style.color = "var(--danger)";
          messageEl.textContent = "Something went wrong. Try again.";
          console.error(error);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";
        }
      });
    </script>
  </body>
</html>
