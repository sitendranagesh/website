<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Sitendra Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        <h1>My Notes <span class="author">by <strong>Sitendra</strong></span></h1>
      </div>
    </header>

    <main class="main-content login-container">
      <div class="login-card">
        <h2>Create Your Account</h2>
        <form id="signup_form">
          <input type="text" id="username" placeholder="Username" autocomplete="username" required />
          <input type="password" id="password" placeholder="Password (min 8 characters)" autocomplete="new-password" required />
          <input type="password" id="confirm_password" placeholder="Confirm password" autocomplete="new-password" required />
          <button type="submit">Create Account</button>
          <p id="signup_error" style="color: var(--danger); margin-top: 1rem; font-weight: 500;"></p>
        </form>
        <p style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
          Already have an account? <a href="./login.html" style="color: var(--primary);">Log in</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Sitendra Kumar Nagesh. All rights reserved.</p>
    </footer>

    <script>
      document.getElementById("signup_form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm_password").value;
        const errorEl = document.getElementById("signup_error");

        errorEl.textContent = "";

        if (password !== confirmPassword) {
          errorEl.textContent = "Passwords don't match.";
          return;
        }

        try {
          const params = new URLSearchParams({ username, password });
          const response = await fetch(`/signup?${params.toString()}`, {
            method: "POST",
          });

          const data = await response.json();

          if (!response.ok) {
            errorEl.textContent = data.detail || "Something went wrong.";
            return;
          }

          window.location.href = "./index.html";
        } catch (error) {
          errorEl.textContent = "Something went wrong. Try again.";
          console.error(error);
        }
      });
    </script>
  </body>
</html>
