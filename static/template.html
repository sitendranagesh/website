<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Note - My Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <header class="site-header">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
      </svg>
      <h1>My Notes <span class="author">by <strong>Sitendra</strong></span></h1>
    </div>
    <div class="header-actions">
      <a href="/blog" class="btn secondary">Blog</a>
      <span id="current_user" class="user-badge"></span>
      <a href="./index.html" class="btn secondary">← Dashboard</a>
      <button id="logout_btn" class="danger">Logout</button>
    </div>
  </header>
    <main class="main-content">
      <div class="note-display-card">
        <h2 id="note_title_display">Loading Title...</h2>
        <p id="get_note" style="white-space: pre-wrap; font-size: 1.1rem; color: var(--text-muted);">Loading note content...</p>
        <textarea id="edit_note_textarea" style="display: none;" rows="15"></textarea>
        
        <div class="note-actions">
          <button id="edit_note" class="primary"> Edit Note </button>
          <button id="save_note" class="success" style="display: none;"> Save Changes </button>
          <button id="delete_note" class="danger"> Delete Note </button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Sitendra Kumar Nagesh. All rights reserved.</p>
    </footer>

    <script>
  document.addEventListener("DOMContentLoaded", async () => {
    // Auth guard
    const authCheck = await fetch("/me");
    const authData = await authCheck.json();
    if (!authData.logged_in) {
      window.location.href = "./login.html";
      return;
    }

    const currentUserEl = document.getElementById("current_user");
    if (currentUserEl && authData.username) {
      currentUserEl.textContent = `Hi, ${authData.username}`;
    }

    const logoutBtn = document.getElementById("logout_btn");

        if (logoutBtn) {
          logoutBtn.addEventListener("click", async () => {
            try {
              await fetch("/logout", { method: "POST" });
            } catch (error) {
              console.error(error);
            } finally {
              window.location.href = "./login.html";
            }
          });
        }

        const getNoteEl = document.getElementById("get_note");
        const titleDisplayEl = document.getElementById("note_title_display");
        const deleteBtn = document.getElementById("delete_note");
        const editBtn = document.getElementById("edit_note");
        const saveBtn = document.getElementById("save_note");
        const editTextarea = document.getElementById("edit_note_textarea");

        const params = new URLSearchParams(window.location.search);
        const title = params.get("title");

        if (!title) {
          return;
        }

        titleDisplayEl.textContent = title;
        getNoteEl.textContent = "Loading...";

        try {
          const response = await fetch(`/note?title=${encodeURIComponent(title)}`);
          const data = await response.json();

          if (!data || data.length === 0) {
            getNoteEl.textContent = "Note not found.";
            return;
          }

          const note = data[0];
          getNoteEl.textContent = note.notecontent;
          getNoteEl.style.color = "var(--text-main)"; // Update color once loaded
        } catch (error) {
          getNoteEl.textContent = "Failed to load note.";
          console.error(error);
        }

        editBtn.addEventListener("click", () => {
          editTextarea.value = getNoteEl.textContent;
          getNoteEl.style.display = "none";
          editTextarea.style.display = "block";
          editBtn.style.display = "none";
          saveBtn.style.display = "inline-flex";
          editTextarea.focus();
        });

        saveBtn.addEventListener("click", async () => {
          const updatedContent = editTextarea.value.trim();

          if (!updatedContent) {
            alert("Note content can't be empty.");
            return;
          }

          saveBtn.disabled = true;
          saveBtn.textContent = "Saving...";

          try {
            const params = new URLSearchParams({
              note_title: title,
              note_content: updatedContent,
            });
            const response = await fetch(`/note?${params.toString()}`, {
              method: "PUT",
            });

            if (!response.ok) {
              throw new Error(`Server responded with ${response.status}`);
            }

            getNoteEl.textContent = updatedContent;
            getNoteEl.style.display = "block";
            editTextarea.style.display = "none";
            saveBtn.style.display = "none";
            editBtn.style.display = "inline-flex";
          } catch (error) {
            console.error(error);
            alert("Failed to save note.");
          } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "Save Changes";
          }
        });

        deleteBtn.addEventListener("click", async () => {
          const confirmed = confirm(`Delete "${title}"? This cannot be undone.`);
          if (!confirmed) return;

          deleteBtn.disabled = true;
          deleteBtn.textContent = "Deleting...";

          try {
            const params = new URLSearchParams({ note_title: title });
            const response = await fetch(`/note?${params.toString()}`, {
              method: "DELETE",
            });

            if (!response.ok) {
              throw new Error(`Server responded with ${response.status}`);
            }

            window.location.href = "./index.html";
          } catch (error) {
            console.error(error);
            alert("Failed to delete note.");
            deleteBtn.disabled = false;
            deleteBtn.textContent = "Delete Note";
          }
        });
      });
    </script>
  </body>
</html>
